# Builds a static Linux binary and attaches it to a GitHub release.
# Runs when a version tag (e.g. v0.3.0) is pushed. "Run workflow" on the
# Actions tab does a test build without creating a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
      ARCHIVE: bookgrab-x86_64-linux.tar.gz
    steps:
      - uses: actions/checkout@v4

      # musl builds a binary with no system library dependencies,
      # so it runs on any Linux distribution.
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          cp "target/$TARGET/release/bookgrab" .
          tar czf "$ARCHIVE" bookgrab LICENSE README.md
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bookgrab-linux
          path: bookgrab-x86_64-linux.tar.gz*

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" \
            --title "bookgrab ${GITHUB_REF_NAME#v}" --generate-notes
